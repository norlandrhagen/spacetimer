name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --group docs

      - name: Run prek
        run: uv run prek run --all-files

      - name: Type check
        run: uv run ty check src/

      - name: Docs build
        run: uv run mkdocs build --strict

      - name: Report examples up to date
        run: uv run python tools/make_report_example.py && git add --intent-to-add docs/assets && git diff --exit-code docs/assets
